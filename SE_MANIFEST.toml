# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_version = "0.5.1"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "se-theory-structural-explainability"
class = "theory"
kind = "foundation"
status = "active"
since = "2026"
summary = "Lean 4 formalization of the Structural Explainability integration layer connecting neutral substrates, identity regimes, traceability, and non-collapse theorem structure."

# === Layer Position ===

[layer]
space = "formal-theory"
role = "theory"

# === Dependency Declarations ===

[depends]
# Required upstream theory repositories.
required = [
  { repository = "se-theory-neutral-substrate", kind = "semantic", version = "v0.11.0" },
  { repository = "se-theory-identity-regimes", kind = "semantic", version = "v0.1.1" },
]

# Optional upstream repository dependencies.
optional = []

# === Provided Artifacts ===

[provides]
# Logical artifacts exposed by this repository.
# These are stable identifiers, not file paths.
artifacts = [
  "lean-library",
  "theorem-set",
  "explanation-structure",
  "integration-theorems",
  "noncollapse-results",
  "traceability-structure",
  "contract-alignment",
]

# === Scope ===

[scope]
includes = [
  "structural explainability theorem integration",
  "traceability from explanation claims to formal sources",
  "integration of neutral substrate and identity-regime theory",
  "non-collapse structure across regimes and transformations",
  "formal alignment between theory repos and downstream contract artifacts",
  "machine-checked Lean theorems",
  "machine-readable reference artifacts for explanation, integration, traceability, and non-collapse layers",
]

excludes = [
  "neutral substrate primitive definitions",
  "identity regime definitions",
  "regime-profile derivation",
  "domain-specific mappings or data",
  "operational runtime systems",
  "repository governance rules",
  "schema definitions for other repositories",
  "application-specific explanation reports",
  "mapping implementation logic",
]

# === Validation ===

[validation]
# Validates repository declaration, manifest schema conformance,
# reference artifacts, generated artifacts, and Lean public surface coverage.
export_check_entrypoint = "uv run --locked se-theory-reference export --check"
reference_entrypoint = "uv run --locked se-theory-reference validate"
strict_entrypoint = "uv run --locked se-theory-reference validate --strict"

# === Behavior / governance ===

[naming]
pattern = "se-theory-*"

[governance]
authority = "structural-explainability"

# === External references ===

[citation]
cff = "CITATION.cff"
preferred = "CITATION.cff"

[traceability]
identifier_map = "reference/theory-reference.toml"
