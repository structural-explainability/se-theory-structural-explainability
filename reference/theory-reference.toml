# ============================================================
# reference/theory-reference.toml
# ============================================================
# Theory reference configuration.
#
# WHY: The theory repository owns Lean source, reference TOML, and exported
# JSON artifacts. The reusable kit owns validation, export, catalog, scaffold,
# and inspection machinery.

schema = "se-theory-reference"
schema_version = "0.1.0"

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "se-theory-structural-explainability"
theory = "structural-explainability"
description = "Structural Explainability theory repository for Structural Explainability."

# === Lean Public Surface ===

[lean]
root_module = "SE.StructuralExplainability"
public_modules = [
  "SE.StructuralExplainability",
  "SE.StructuralExplainability.Core",
  "SE.StructuralExplainability.Spec",
  "SE.StructuralExplainability.Surface",
]

test_modules = [
  "TestAll",
  "TestBasic",
  "TestRegime",
]

# === Reference Artifacts ===

[reference]
root = "reference"

# === Exported Machine Artifacts ===

[export]
root = "data/structural-explainability"

# === Surface-Kind Mapping ===

[surface_kinds]
axiom = "reference/substrate-axioms.toml"
dependency = "reference/dependency-registry.toml"
predicate = "reference/substrate-predicates.toml"
requirement = "reference/substrate-requirements.toml"
theorem = "reference/substrate-theorems.toml"
traceability = "reference/traceability-registry.toml"
type = "reference/substrate-types.toml"

# === Export Mapping ===

[export_map]
axiom = "data/structural-explainability/substrate-axiom-registry.json"
catalog = "data/structural-explainability/structural-explainability-catalog.json"
predicate = "data/structural-explainability/substrate-predicate-registry.json"
requirement = "data/structural-explainability/substrate-requirement-registry.json"
theorem = "data/structural-explainability/substrate-theorem-registry.json"
traceability = "data/structural-explainability/traceability-registry.json"
type = "data/structural-explainability/substrate-type-registry.json"
